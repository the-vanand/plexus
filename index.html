<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plexus</title>
    <!--
      Шрифт ИНТЕРФЕЙСА грузится постоянной ссылкой и никогда не меняется.
      Шрифты ТЕМЫ САЙТА живут в отдельной ссылке (id="plx-theme-fonts") и
      влияют только на холст/предпросмотр — стиль сайта не трогает IDE.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Мгновенный графитовый фон до загрузки бандла — без белой вспышки */
      html, body { margin: 0; background: #252b30; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
